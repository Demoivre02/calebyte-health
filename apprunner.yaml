version: 1.0
runtime: nodejs14
build:
  commands:
    pre-build:
      - n 22.14.0
      - node --version
      - npm --version
    build:
      - echo "Installing pnpm..."
      - npm install -g pnpm
      - echo "Installing dependencies..."
      - pnpm install --frozen-lockfile
      - echo "Building application..."
      - pnpm build
run:
  command: pnpm start
  network:
    port: 3000
    env: PORT
  env:
    - name: NODE_ENV
      value: production