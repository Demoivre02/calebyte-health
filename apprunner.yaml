version: 1.0
runtime: nodejs18
build:
  commands:
    build:
      - echo "Installing dependencies with npm..."
      - npm install
      - echo "Building application..."
      - npm run build
run:
  runtime-version: 18.20.8
  command: npm start
  network:
    port: 3000
    env: PORT
  env:
    - name: NODE_ENV
      value: production